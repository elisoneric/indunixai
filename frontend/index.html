    <!-- Sovereign High-Speed Preloader Styles (Instant 0ms First Contentful Paint) -->
    <style>
      #indunix-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #07090E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #F8FAFC;
      }
      .preloader-emblem {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }
      .preloader-glow {
        position: absolute;
        inset: -14px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, rgba(6, 182, 212, 0.15) 50%, transparent 70%);
        filter: blur(14px);
        animation: preloader-pulse 2s ease-in-out infinite alternate;
      }
      .preloader-brand {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #FFFFFF;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preloader-brand .accent {
        color: #10B981;
        text-shadow: 0 0 16px rgba(16, 185, 129, 0.7);
      }
      .preloader-sub {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: #94A3B8;
        margin-bottom: 24px;
        text-align: center;
      }
      .preloader-track {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, #10B981, #06B6D4);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
        animation: preloader-slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .preloader-status {
        margin-top: 14px;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #64748B;
        letter-spacing: 0.08em;
      }
      @keyframes preloader-pulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes preloader-slide {
        0% { left: -50%; width: 30%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
