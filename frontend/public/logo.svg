<svg width="256" height="256" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="indunix-grad-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="indunix-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="indunix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="40" height="40" rx="10" fill="#07090E" />

  <!-- Outer Hexagonal Shield -->
  <path
    d="M20 5L33 12.5V27.5L20 35L7 27.5V12.5L20 5Z"
    fill="#0B0F19"
    stroke="url(#indunix-grad-hex)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Ambient Core Glow -->
  <circle cx="20" cy="20" r="7" fill="url(#indunix-grad-core)" opacity="0.25" filter="url(#indunix-glow)" />

  <!-- Central Sovereign Nexus Lines -->
  <path
    d="M14 14L26 26M26 14L14 26"
    stroke="url(#indunix-grad-hex)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Central Core Node -->
  <circle cx="20" cy="20" r="3.2" fill="#FFFFFF" />
  <circle cx="20" cy="20" r="1.8" fill="#10B981" />

  <!-- Vertex Neural Satellites -->
  <circle cx="20" cy="9" r="1.3" fill="#34D399" />
  <circle cx="29" cy="14.5" r="1.3" fill="#06B6D4" />
  <circle cx="29" cy="25.5" r="1.3" fill="#3B82F6" />
  <circle cx="20" cy="31" r="1.3" fill="#10B981" />
  <circle cx="11" cy="25.5" r="1.3" fill="#06B6D4" />
  <circle cx="11" cy="14.5" r="1.3" fill="#34D399" />
</svg>
