server {
    listen 80;
    server_name indunixai.com www.indunixai.com docs.indunixai.com console.indunixai.com api.indunixai.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static icon and metadata handling
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files /favicon.ico /favicon.svg =204;
    }

    location = /favicon.svg {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # High-Speed OpenAI-compatible API Gateway (Streaming SSE passthrough)
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time streaming LLM completions
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Administrative and Console API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
