services:
  # Indunix High-Speed Sovereign Gateway & API Server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: indunix-backend
    restart: always
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend.rule=Host(`api.indunixai.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure,https"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-indunix_user}:${POSTGRES_PASSWORD:-indunix_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-indunix_db}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-indunix-sovereign-ai-jwt-super-secret-key-2026-prod-v1}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MOCK_UPSTREAM_IF_UNSET=${MOCK_UPSTREAM_IF_UNSET:-false}
      - ENTERPRISE_LEASE_SIGNING_KEY=${ENTERPRISE_LEASE_SIGNING_KEY:-indunix-edge-ent-master-sig-key-2026}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@indunixai.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Indunix AI}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-system@indunixai.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-200127368906-nm76siltlis1m4rk45h77kks71mp77f1.apps.googleusercontent.com}
    volumes:
      - indunix_backend_data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - indunix-network
      - coolify

  # Indunix Dark Glassmorphic Marketing & Developer Console Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indunix-frontend
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend.rule=Host(`indunixai.com`) || Host(`www.indunixai.com`) || Host(`docs.indunixai.com`) || Host(`console.indunixai.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure,https"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - backend
    networks:
      - indunix-network
      - coolify

  # PostgreSQL Ledger & Database (Internal only - no host port collision)
  postgres:
    image: postgres:16-alpine
    container_name: indunix-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-indunix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-indunix_secure_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-indunix_db}
    expose:
      - "5432"
    volumes:
      - indunix_postgres_data:/var/lib/postgresql/data
    networks:
      - indunix-network

  # Redis Token Bucket & Cache (Internal only - no host port collision)
  redis:
    image: redis:7-alpine
    container_name: indunix-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - indunix_redis_data:/data
    networks:
      - indunix-network

volumes:
  indunix_postgres_data:
  indunix_redis_data:
  indunix_backend_data:

networks:
  indunix-network:
    driver: bridge
  coolify:
    external: true
